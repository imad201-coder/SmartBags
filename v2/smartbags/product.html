<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartBags</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/product.css">
<script src="js/i18n.js"></script>
<script>applyDirection(getLang());</script>
</head>
<body>

<header id="site-navbar" class="nav"></header>

<main>
  <section class="product-main">
    <div class="slider" id="slider">
      <div class="slider-track" id="slider-track"></div>
      <button class="slider-btn slider-prev" id="slider-prev" aria-label="Previous image">‹</button>
      <button class="slider-btn slider-next" id="slider-next" aria-label="Next image">›</button>
      <div class="slider-dots" id="slider-dots"></div>
    </div>
    <div class="product-info" id="product-info"></div>
  </section>

  <section class="features product-features" id="product-features"></section>

  <section class="product-description" id="product-description"></section>
</main>

<footer id="site-footer" class="footer"></footer>

<div class="modal-overlay" id="buy-modal">
  <div class="modal-panel">
    <button class="modal-close" id="modal-close" aria-label="Close">×</button>
    <h3 class="modal-title" data-i18n="modalTitle">Complete your order</h3>
    <p class="modal-sub" data-i18n="modalSubtitle">Fill in your details — you pay in cash when your order arrives.</p>
    <form id="buy-form" novalidate>
      <div class="field">
        <label data-i18n="colorLabel">Color</label>
        <input type="text" id="modal-color-value" value="" readonly tabindex="-1">
      </div>
      <div class="field">
        <label for="field-name" data-i18n="nameLabel">Full name</label>
        <input type="text" id="field-name" name="name" autocomplete="name">
      </div>
      <div class="field">
        <label for="field-phone" data-i18n="phoneLabel">Phone number</label>
        <input type="tel" id="field-phone" name="phone" autocomplete="tel" dir="ltr">
      </div>
      <div class="field">
        <label for="field-address" data-i18n="addressLabel">Address</label>
        <textarea id="field-address" name="address" rows="2"></textarea>
      </div>
      <div class="field">
        <label for="field-province" data-i18n="provinceLabel">Province</label>
        <select id="field-province" name="province"></select>
      </div>
      <div class="field">
        <label data-i18n="deliveryTypeLabel">Delivery type</label>
        <div class="delivery-type">
          <label class="delivery-option is-checked">
            <input type="radio" name="delivery-type" value="desk" checked>
            <span data-i18n="stopDesk">Stop desk</span>
          </label>
          <label class="delivery-option">
            <input type="radio" name="delivery-type" value="domicile">
            <span data-i18n="homeDelivery">Home delivery</span>
          </label>
        </div>
      </div>
      <div class="order-total">
        <span class="order-total-label" data-i18n="totalLabel">Total to pay</span>
        <span class="order-total-value" id="order-total-value">—</span>
      </div>
      <p class="field-error" id="form-error"></p>
      <button type="submit" class="btn btn-gold btn-block" data-i18n="confirmOrder" style="margin-top:18px;">Confirm order</button>
    </form>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/product.js"></script>
</body>
</html>
